title: Écriture dans authorized_keys détectée par une surveillance de fichier auditd
id: 5e8b2c47-3f19-4a60-b7d3-1c9e0a6f8d24
status: experimental
description: >
  Détecte une écriture dans ~/.ssh/authorized_keys remontée par auditd
  (règle de surveillance « -w <fichier> -p wa »). Le chargeur de l'extension
  Claude Code 2.1.313 ajoute sa clé « svc-telemetry » par une écriture de
  fichier directe : en laboratoire, l'ajout n'a produit AUCUNE ligne de
  commande contenant le nom de la clé (voir experiment-log.md, EXP-004), donc
  une règle fondée sur la ligne de commande est aveugle. L'écriture seule est
  le signal ; il faut ensuite corréler avec le processus (enregistrement
  SYSCALL du même événement) pour écarter ssh-copy-id et les outils d'admin.
references:
  - https://www.ox.security/blog/malicious-claude-code-extension-cursor-ssh-backdoor/
author: Eizi0
date: 2026-10-30
tags:
  - attack.persistence
  - attack.t1098.004
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'PATH'
    name|endswith: '/.ssh/authorized_keys'
  condition: selection
falsepositives:
  - ssh-copy-id, outils de gestion de configuration (Ansible, Puppet), administrateurs.
    À filtrer par exécutable du SYSCALL associé, après un apprentissage de la base.
level: medium
