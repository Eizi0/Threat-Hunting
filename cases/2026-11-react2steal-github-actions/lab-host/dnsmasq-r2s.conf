# Trou noir DNS du labo : les API d'IA répondent 127.0.0.9 et ::1 (rien n'écoute sur 443), tout le reste part à l'amont.
# IPv6 ajouté après un premier passage où les requêtes AAAA partaient à l'amont (connexions échouées faute de route IPv6).
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=UPSTREAM_DNS
log-queries
log-facility=/var/log/dnsmasq-r2s.log
address=/api.openai.com/127.0.0.9
address=/api.openai.com/::1
address=/api.anthropic.com/127.0.0.9
address=/api.anthropic.com/::1
address=/generativelanguage.googleapis.com/127.0.0.9
address=/generativelanguage.googleapis.com/::1
address=/api.deepseek.com/127.0.0.9
address=/api.deepseek.com/::1
address=/openrouter.ai/127.0.0.9
address=/openrouter.ai/::1
