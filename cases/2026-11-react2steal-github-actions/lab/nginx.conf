events {}
http {
  # Format par défaut (combined) : ce que la plupart des serveurs journalisent réellement
  log_format combined_default '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  # Format enrichi JSON : en-têtes utiles à la détection
  log_format json_detect escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri","status":$status,'
    '"ua":"$http_user_agent","content_type":"$content_type","next_action":"$http_next_action",'
    '"x_action_id":"$http_x_action_id","x_middleware_subrequest":"$http_x_middleware_subrequest","transfer_encoding":"$http_transfer_encoding"}';
  map $http_x_middleware_subrequest $strip { default ""; }
  server {
    listen 127.0.0.1:8080;   # sans filtrage
    access_log /var/log/nginx/default.log combined_default;
    access_log /var/log/nginx/detect.json json_detect;
    location / { proxy_pass http://127.0.0.1:3000; }
  }
  server {
    listen 127.0.0.1:8081;   # mitigation : en-tête retiré par le proxy
    access_log /var/log/nginx/detect-mitigated.json json_detect;
    location / { proxy_set_header x-middleware-subrequest ""; proxy_pass http://127.0.0.1:3000; }
  }
}
