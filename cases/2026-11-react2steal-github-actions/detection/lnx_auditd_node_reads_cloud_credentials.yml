title: Processus Node.js d'un serveur web qui lit des identifiants cloud ou un jeton Kubernetes
id: 2d8f4a63-7e1b-4c9d-b5a2-3f6e8c1d9a07
status: experimental
description: >
  Un serveur Next.js compromis par CVE-2025-55182 exécute du JavaScript dans son propre processus : la
  collecte de React2STEAL (fast_recon.js) lit les fichiers d'identifiants cloud et le jeton de compte de service
  Kubernetes sans lancer aucun processus enfant, ce qui rend aveugles les règles « node lance un shell ». Vérifié
  en labo (auditd, Next.js 15.5.6) : 0 execve pendant la collecte, lecture visible de ~/.aws/credentials et du jeton.
  Format attendu : un événement auditd fusionné (SYSCALL + PATH), comme le produisent Auditbeat ou un parseur
  équivalent, avec l'exécutable dans exe et le chemin dans name. Surveillances de fichiers à poser : voir lab-host/audit.rules.
references:
  - https://opensourcemalware.com/blog/react2steal-github-actions
  - https://www.wiz.io/blog/nextjs-cve-2025-55182-react2shell-deep-dive
author: Eizi0
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1528
logsource:
  product: linux
  service: auditd
detection:
  selection_exe:
    exe|endswith: '/node'
  selection_path:
    name|contains:
      - '/.aws/credentials'
      - '/.aws/config'
      - '/serviceaccount/token'
      - '/.kube/config'
      - '/.config/gcloud/'
      - '/.azure/'
      - '/.docker/config.json'
  condition: all of selection_*
falsepositives:
  - Application qui utilise réellement un SDK cloud avec un fichier d'identifiants partagé (préférer des identifiants par rôle d'instance ou variables, puis filtrer ce serveur précisément).
  - Pod Kubernetes dont l'application appelle l'API Kubernetes avec son jeton de compte de service.
level: high
