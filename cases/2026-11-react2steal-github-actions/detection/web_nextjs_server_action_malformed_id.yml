title: Appel de Server Action Next.js avec un identifiant mal formé (indicateur de campagne React2STEAL)
id: c4e1a9d3-7b2f-4e8c-a1d5-6f3b8c2e9d03
status: experimental
description: >
  Un client légitime envoie dans l'en-tête Next-Action l'identifiant de l'action généré à la compilation
  (42 caractères hexadécimaux sous Next.js 15.2.2, vérifié en labo ; 40 sur des versions plus anciennes).
  (40 caractères sur 14.2.24, 42 sur 15.x et 16.x, vérifié en labo). Une valeur hors de ce format
  (React2STEAL envoie "x") signale un scanner. LIMITE : sur une version vulnérable, un faux identifiant au bon
  format atteint aussi la désérialisation (vérifié en labo) et passe sous cette règle. Elle sert d'indicateur de
  campagne ; la détection générique est web_nextjs_server_action_unknown_id (liste des identifiants du build).
  La sélection campagne repère en plus la boundary multipart propre à React2STEAL.
  Suppose un journal qui enregistre les en-têtes Next-Action et Content-Type.
references:
  - https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components
  - https://opensourcemalware.com/blog/react2steal-github-actions
author: Eizi0
date: 2026-11-23
tags:
  - attack.initial-access
  - attack.t1190
  - cve.2025-55182
logsource:
  category: webserver
detection:
  selection_action:
    method: 'POST'
    next_action|re: '.+'
  filter_valid_id:
    next_action|re: '^[0-9a-f]{40,42}$'
  selection_campaign:
    content_type|contains: 'bissa_cve_boundary'
  condition: (selection_action and not filter_valid_id) or selection_campaign
falsepositives:
  - Changement du format des identifiants d'action dans une version future de Next.js (à revalider après mise à jour).
level: medium
